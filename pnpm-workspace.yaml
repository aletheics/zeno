packages:
  - apps/*
  - packages/*

catalogMode: prefer

catalog:
  "@earendil-works/pi-coding-agent": 0.85.0
  "@silvia-odwyer/photon-node": 0.3.4
  "@types/node": 26.1.1
  "@types/react": 19.2.17
  "@types/react-dom": 19.2.3
  electron: 43.1.1
  electron-builder: 26.15.3
  react: 19.2.7
  react-dom: 19.2.7
  typescript: 6.0.2
  vite: npm:@voidzero-dev/vite-plus-core@0.2.4
  vite-plus: 0.2.4
  vitest: 4.1.10
  playwright: 1.55.0
  "@playwright/test": 1.55.0
  zustand: 5.0.3
  tailwindcss: 4.1.11
  "@tailwindcss/vite": 4.1.11
  lucide-react: 0.525.0
  class-variance-authority: 0.7.1
  clsx: 2.1.1
  tailwind-merge: 3.3.1
  highlight.js: 11.11.1
  katex: 0.18.1
  mermaid: 11.16.1
  react-markdown: ^10.1.0
  rehype-katex: 7.0.1
  remark-gfm: ^4.0.1
  rehype-sanitize: ^6.0.0
  remark-math: 6.0.0
  tw-animate-css: ^1.4.0
  radix-ui: ^1.6.4
  "@shadcn/react": ^0.2.1
  cmdk: ^1.1.1
  node-pty: ^1.1.0
  ghostty-web: 0.4.0
  electron-updater: 6.8.9
  jsdom: ^30.0.1
  "@testing-library/react": ^16.3.3
  "@testing-library/jest-dom": ^7.0.1

overrides:
  vite: "catalog:"
  # CVE-2026-59870 修复：electron-updater 传递依赖 js-yaml 需 >=4.3.1（限 4.x，避免 5.x 破坏 API）
  js-yaml: "~4.3.1"
  # GHSA-55q2-fjhq-7xh7 修复：mermaid 传递依赖 dompurify 需 >=3.4.13
  dompurify: ">=3.4.13"
  # GHSA-mh99-v99m-4gvg / GHSA-rgw5-rvv9-x895 修复：brace-expansion 5.x DoS（仅限 5.x，避免破坏 1.x/2.x）
  "brace-expansion@^5.0.0": ">=5.0.9"

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"

minimumReleaseAgeExclude:
  - "@earendil-works/chord@0.85.0"
  - "@earendil-works/pi-agent-core@0.85.0"
  - "@earendil-works/pi-ai@0.85.0"
  - "@earendil-works/pi-client@0.85.0"
  - "@earendil-works/pi-coding-agent@0.85.0"
  - "@earendil-works/pi-protocol@0.85.0"
  - "@earendil-works/pi-telemetry@0.85.0"
  - "@earendil-works/pi-tui@0.85.0"
  - electron@43.1.1

allowBuilds:
  "@google/genai": false
  "@tailwindcss/oxide": true
  electron-winstaller: false
  esbuild: false
  node-pty: true
  protobufjs: false

patchedDependencies:
  "@earendil-works/pi-coding-agent": patches/@earendil-works__pi-coding-agent.patch
